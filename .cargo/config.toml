# ts-rs writes one file per exported type under src/bindings. Large integers
# (u64, i64, i128, u128) cross IPC as JSON numbers, so bind them to `number`,
# not ts-rs's default `bigint`.
[env]
TS_RS_EXPORT_DIR = { value = "src/bindings", relative = true }
TS_RS_LARGE_INT = "number"

# MSVC's link.exe is slow to link a crate this size; LLVM's linker, shipped
# with Rust, links the same objects much faster.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"
