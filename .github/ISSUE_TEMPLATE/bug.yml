name: Bug report
description: Something in Screenwide doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Screenwide version
      description: Shown in Settings, under General.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1, Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Editor on a recording
        2. Drag the trim handle
        3. The playhead jumps to the start
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, recordings or logs
      description: Drag files in here. Leave out anything private.
