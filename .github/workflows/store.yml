# Bundles a published release's packages for the Microsoft Store: both
# architectures in one .msixbundle, saved on the run for uploading in Partner
# Center by hand, with the release notes in the run's summary for What's new.
# Nothing is sent to the Store: its API processes an upload only when the
# submission is committed, and committing submits it for certification, so a
# submission that is checked before Submit is pressed has to be filled in by
# hand.
name: Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bundle, such as v1.0.1
        required: true

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle for the Store
    # The Store takes plain versions only, so a prerelease has no package.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the release's packages
        shell: pwsh
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*.msix" --dir msix
          $packages = Get-ChildItem msix -Filter *.msix
          if ($packages.Count -ne 2) { throw "Expected the x64 and ARM64 packages, found $($packages.Count)" }
          $packages | ForEach-Object { $_.Name }

      # Once a release has shipped as a bundle, every later submission must
      # carry one, so both architectures go up together in it.
      - name: Bundle both architectures
        shell: pwsh
        run: |
          $version = "$($env:TAG.TrimStart('v')).0"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force upload | Out-Null
          & $makeappx.FullName bundle /d msix /p "upload\Screenwide_$version.msixbundle" /bv $version /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Save the bundle on the run
        uses: actions/upload-artifact@v7
        with:
          name: Screenwide_${{ env.VERSION }}.msixbundle
          path: upload/Screenwide_${{ env.VERSION }}.msixbundle
          # The packages inside are compressed already.
          compression-level: 0
          if-no-files-found: error

      - name: Write the steps and What's new to the summary
        shell: pwsh
        run: |
          # PowerShell captures each line of a command's output as an array
          # element; the Store wants the notes as one string.
          $notes = (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body) -join "`n"
          # The Store takes plain text of at most 1500 characters.
          if ($notes.Length -gt 1500) { $notes = $notes.Substring(0, 1500) }
          $fence = '````'
          @(
            "Download Screenwide_$env:VERSION.msixbundle from this run's artifacts and unzip it. In Partner Center, start an update, drag the bundle onto Packages and remove the last release's package, paste What's new below into each listing, then press Submit for certification. Set Publishing to manual if it should wait for Publish now after certification.",
            '',
            "What's new:",
            '',
            $fence,
            $notes,
            $fence
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
