name: Sanity Check

# Work is committed straight to main, so main is checked nightly rather than on
# every push, and only when it has moved since the last passing check. A pull
# request is checked too, for contributions.
on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: Needs check
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - name: Compare main with the last passing check
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sanity-check.yml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$passed" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, which already passed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sanity-check:
    name: ${{ matrix.os }}
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The transcriber's engine draws on the GPU through Vulkan on Windows,
      # and builds its shaders with the SDK's compiler.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
          vulkan_version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Diagnostic: the app's tests crash on Windows with an access violation,
      # and a parallel run cannot say which test. One at a time, the last test
      # started is the one that crashed.
      - name: Name the crashing Windows test
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pnpm native:prepare && cargo test --manifest-path src-tauri/Cargo.toml -p screenwide --lib -- --test-threads=1

      - name: Check formatting, lint, and builds
        run: pnpm check
