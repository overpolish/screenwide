name: Sanity Check

# Work is committed straight to main, so main is checked nightly rather than on
# every push, and only when it has moved since the last passing check. A pull
# request is checked too, for contributions. GitHub starts scheduled runs late
# when it is busy, most at the top of the hour, so this asks for an odd minute
# in the small hours, UK time.
on:
  schedule:
    - cron: "37 0 * * *"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: Needs check
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - name: Compare main with the last passing check
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sanity-check.yml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$passed" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, which already passed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sanity-check:
    name: ${{ matrix.os }}
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # Hosted runners have no hardware GPU or video encoder; the tests that
    # need one are ignored under this cfg. ESLint's type-aware rules load the
    # app's and each Worker's TypeScript at once, more than Node's default
    # heap holds on the macOS runner.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      RUSTFLAGS: --cfg screenwide_no_gpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # rustup is on every runner image already; this installs the toolchain
      # rust-toolchain.toml pins, with its components.
      - name: Install Rust
        run: rustup toolchain install

      # The transcriber's engine draws on the GPU through Vulkan on Windows,
      # and builds its shaders with the SDK's compiler.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
          vulkan_version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CMake keeps the paths of the MSVC tools a build folder was configured
      # with, and a runner image update can remove that toolset, so a folder
      # kept from another toolset fails to link. On Windows the cache is kept
      # per toolset, which starts the helpers' build afresh when it changes.
      - name: Name the native helpers' cache
        id: helpers-cache
        shell: bash
        run: |
          set -euo pipefail
          prefix="helpers-$RUNNER_OS"
          if [ "$RUNNER_OS" = Windows ]; then
            file=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
              -latest -products '*' -find 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')
            [ -n "$file" ] || { echo "No MSVC toolset found"; exit 1; }
            prefix="$prefix-msvc$(tr -d '[:space:]' < "$(cygpath -u "$file")")"
          fi
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      # The native helpers take the longest to build from nothing, a quarter
      # of an hour or more, and change rarely. Their build folder is kept
      # between runs, with cargo's downloads that the build scripts' change
      # tracking reads, and saved even when a later check fails, as it is
      # whole once the helpers are built. The app's own build is too large
      # for the repository's cache.
      - name: Restore the native helpers' build
        id: helpers
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            ${{ runner.os == 'Windows' && 'C:\ProgramData\swb' || 'src-tauri/target/stt' }}
          key: ${{ steps.helpers-cache.outputs.prefix }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/transcriber/Cargo.lock') }}
          restore-keys: ${{ steps.helpers-cache.outputs.prefix }}-

      - name: Check formatting, lint, and builds
        run: pnpm check

      - name: Save the native helpers' build
        if: always() && steps.helpers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            ${{ runner.os == 'Windows' && 'C:\ProgramData\swb' || 'src-tauri/target/stt' }}
          key: ${{ steps.helpers-cache.outputs.prefix }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/transcriber/Cargo.lock') }}
