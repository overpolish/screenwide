name: macOS GPU Tests

# The tests that draw on the GPU, run on GitHub's macOS runner at the commits
# asked for, each commit and mode on a runner of its own. The runner's GPU is
# a virtual one that draws many of them black at random, so the sanity check
# skips them there (`screenwide_no_gpu`); this runs them anyway, to see
# whether a newer runner image draws them right.
#
# A mode is how the tests run: `parallel` as `cargo test` runs them, or
# `serial` one test at a time. Each runs the tests `runs` times over, and the
# job's summary lists every run's result.
on:
  workflow_dispatch:
    inputs:
      refs:
        description: Commits, branches or tags to test, separated by spaces
        required: true
        default: main
      modes:
        description: "Modes, separated by spaces: parallel, serial"
        required: true
        default: parallel
      runs:
        description: How many times each mode runs the tests
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  refs:
    name: Commits to test
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.list.outputs.commits }}
      modes: ${{ steps.list.outputs.modes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Checkout takes a full commit hash or a branch or tag, not a short
      # hash, so each is resolved here and named as it was given.
      - name: Resolve the commits
        id: list
        env:
          REFS: ${{ inputs.refs }}
          MODES: ${{ inputs.modes }}
        run: |
          commits='[]'
          for ref in $REFS; do
            sha=$(git rev-parse --verify "$ref^{commit}" 2>/dev/null || git rev-parse --verify "origin/$ref^{commit}")
            commits=$(jq -c --arg name "$ref" --arg sha "$sha" '. + [{name: $name, sha: $sha}]' <<< "$commits")
          done
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "modes=$(jq -cn --arg modes "$MODES" '$modes | split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  gpu-tests:
    name: ${{ matrix.commit.name }}, ${{ matrix.mode }}
    needs: refs
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.refs.outputs.commits) }}
        mode: ${{ fromJSON(needs.refs.outputs.modes) }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit.sha }}

      - name: Describe the commit and the GPU
        run: |
          git log -1 --format='%H %s'
          system_profiler SPDisplaysDataType

      # A commit from before rust-toolchain.toml pinned the toolchain builds
      # with the runner's stable.
      - name: Install Rust
        run: |
          if [ -f rust-toolchain.toml ]; then
            rustup toolchain install
          else
            rustup toolchain install stable
          fi

      - name: Restore cargo's downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: macos-gpu-tests-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-gpu-tests-cargo-

      # Built as each suite runs, one package at a time, so the runs below
      # build nothing again.
      - name: Build the tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -p screenwide-compositor --lib --no-run
          cargo test --manifest-path src-tauri/Cargo.toml -p screenwide-export --lib --no-run

      # The export's video tests are left out: they need the prepared
      # FFmpeg.
      - name: Run the tests
        env:
          MODE: ${{ matrix.mode }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -o pipefail
          threads=()
          case "$MODE" in *serial*) threads=(--test-threads=1) ;; esac
          echo "| Run | Tests | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for run in $(seq 1 "$RUNS"); do
            for suite in compositor export; do
              if [ "$suite" = compositor ]; then
                filters=()
              else
                filters=(render_tests composites_keyboard_pixels_into_a_gpu_still)
              fi
              echo "::group::Run $run, $suite tests"
              cargo test --manifest-path src-tauri/Cargo.toml -p "screenwide-$suite" --lib --no-fail-fast \
                -- "${filters[@]}" "${threads[@]}" 2>&1 | tee run.log || status=1
              echo "::endgroup::"
              result=$(grep -E '^test result:' run.log | tail -1)
              echo "Run $run, $suite tests: ${result:-no result}"
              echo "| $run | $suite | ${result:-no result} |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit "$status"
