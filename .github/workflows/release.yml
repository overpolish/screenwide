name: Release

# A pushed tag builds every platform into a draft release. Started by hand,
# it builds only the platforms asked for, from the branch it runs on, into
# the release of the tag given, replacing their files there: a macOS fix to
# a release whose Windows package the Microsoft Store already has.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild into, such as v1.1.0
        required: true
      platforms:
        description: Platforms to rebuild
        required: true
        type: choice
        default: macos
        options: [macos, windows, all]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      # Every tag, so the notes can find the last release to compare with.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or find draft release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            node scripts/release-notes.mjs "$TAG_NAME" > release-notes.md
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Screenwide $TAG_NAME" \
              -F draft=true \
              -F body=@release-notes.md \
              --jq .id)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Choose the platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[
            {"name": "macOS Apple Silicon", "platform": "macos", "os": "macos-15", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin --bundles app,dmg"},
            {"name": "Windows x64", "platform": "windows", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "args": "--target x86_64-pc-windows-msvc --no-bundle"},
            {"name": "Windows ARM64", "platform": "windows", "os": "windows-11-arm", "target": "aarch64-pc-windows-msvc", "args": "--target aarch64-pc-windows-msvc --no-bundle"}
          ]'
          echo "platforms=$(jq -c --arg only "$PLATFORMS" 'map(select($only == "all" or .platform == $only))' <<< "$all")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows is released through the Microsoft Store only: its jobs build
      # the app for the Store package and attach no installer.
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # rustup is on every runner image already; this installs the toolchain
      # rust-toolchain.toml pins, which builds for the runner's own target.
      - name: Install Rust
        run: rustup toolchain install

      # The transcriber's engine draws on the GPU through Vulkan on Windows,
      # and builds its shaders with the SDK's compiler.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          install_runtime: false
          vulkan_version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:check-version ${{ env.RELEASE_TAG }}

      - name: Build and upload signed bundles
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          tagName: ${{ env.RELEASE_TAG }}
          uploadUpdaterJson: true
          # No version in the names, so the website can link to
          # releases/latest/download/Screenwide_aarch64.dmg. latest.json
          # carries the updater bundle's own address.
          releaseAssetNamePattern: "[name]_[arch][ext]"

      - name: Build the app
        if: runner.os == 'Windows'
        run: pnpm tauri build ${{ matrix.args }}

      # The speech enhancer's kernels are assembled per processor (and patched
      # for ARM64, `src-tauri/vendor`); running it here proves them on each.
      - name: Check the speech enhancer runs
        if: runner.os == 'Windows'
        run: pnpm transcriber:check-clean --target ${{ matrix.target }}

      # The Microsoft Store package. It goes to the draft release; for a
      # release chosen for the Store, the Microsoft Store workflow, started by
      # hand, submits it, and the Store signs it. The Store takes plain
      # versions only, so a prerelease has none.
      - name: Pack and attach the Microsoft Store package
        if: runner.os == 'Windows' && !contains(env.RELEASE_TAG, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm msix:package --target ${{ matrix.target }}
          gh release upload "${{ env.RELEASE_TAG }}" \
            src-tauri/target/${{ matrix.target }}/release/bundle/msix/*.msix --clobber

  verify:
    name: Verify updater assets
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Download updater manifest
        run: |
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "latest.json") | .id')"
          if [ -z "$asset_id" ]; then
            echo "The draft release does not contain latest.json" >&2
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > latest.json

      - name: Verify updater platforms
        run: |
          expected_version="${RELEASE_TAG#v}"
          jq --exit-status --arg version "$expected_version" '
            .version == $version and
            (.platforms["darwin-aarch64"].url | type == "string" and length > 0) and
            (.platforms["darwin-aarch64"].signature | type == "string" and length > 0)
          ' latest.json > /dev/null

      - name: Verify updater download
        run: |
          url="$(jq --raw-output '.platforms["darwin-aarch64"].url' latest.json)"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            --range 0-0 "$url" > /dev/null

  # Both architectures' Store packages bundled into the one upload Partner
  # Center takes, attached to the draft for a submission made by hand. Built
  # whenever the Windows packages are, so a rebuild replaces it with them.
  store-upload:
    name: Bundle the Microsoft Store upload
    needs: [prepare, build]
    if: ${{ !contains(inputs.tag || github.ref_name, '-') && inputs.platforms != 'macos' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Bundle and attach the Store upload
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --pattern "*.msix" --dir msix --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the packages" }
          $upload = node scripts/bundle-msix.mjs msix $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Could not bundle the packages" }
          gh release upload $env:RELEASE_TAG $upload --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the upload" }
