[package]
name = "screenwide-settings-preview"
description = "Live pictures inside a window, drawn by the app's own renderers: the tools at work and recordings composed by the editor's compositor"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
screenwide-auto-zoom.workspace = true
screenwide-compositor.workspace = true
screenwide-cursor-effects.workspace = true
screenwide-export.workspace = true
screenwide-gpu.workspace = true
screenwide-imaging.workspace = true
screenwide-output.workspace = true
screenwide-records.workspace = true
screenwide-scenes.workspace = true
screenwide-shader-layout.workspace = true
serde.workspace = true
ts-rs.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
] }

[dev-dependencies]
image.workspace = true
serde_json.workspace = true

[build-dependencies]
screenwide-shader-layout.workspace = true
screenwide-wgsl.workspace = true
