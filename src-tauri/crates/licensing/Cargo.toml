[package]
name = "screenwide-licensing"
description = "Who may use the paid tools: the trial, licence keys and the records that prove them"
version.workspace = true
authors.workspace = true
# The gate the tools sit behind is theirs: under the GPL it could be removed
# freely, which the Elastic License forbids.
license = "Elastic-2.0"
edition.workspace = true

[lib]
doctest = false

[dependencies]
base64 = "0.22"
getrandom.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
