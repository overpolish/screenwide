[package]
name = "screenwide-system-keys"
description = "The system's own screenshot keys, taken for Screenwide's tools while it asks for them"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-graphics.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
screenwide-keyboard-hook.workspace = true
windows = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse"] }
