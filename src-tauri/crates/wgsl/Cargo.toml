[package]
name = "screenwide-wgsl"
description = "For build scripts: joining WGSL shaders from their parts, validating them and compiling them ahead of time"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
# The same naga wgpu compiles WGSL with, so a shader that builds also loads,
# and a shader precompiled here is the text wgpu would write.
naga = { workspace = true, features = ["wgsl-in", "hlsl-out", "msl-out"] }
