[package]
name = "screenwide-qr"
description = "The QR codes in a picture: what each holds and where it is"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
image.workspace = true
rqrr = { version = "0.10.1", default-features = false, features = ["img"] }
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "multi_barcode_readers", "qrcode"] }

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
