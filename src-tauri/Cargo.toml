[package]
name = "screenwide"
description = "Reliable screen and audio recording for macOS and Windows"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

# The app crate sits on top; the crates under `crates/` are what it is built
# from, each a layer the ones above it depend on and never the reverse.
[workspace]
members = ["crates/*"]
# The transcriber builds into its own program with its own profile, and the
# vendored crates are only patches.
exclude = ["transcriber", "vendor"]

[workspace.package]
version = "0.1.0"
authors = ["overpolish"]
license = "GPL-3.0-or-later"
edition = "2021"

[workspace.dependencies]
screenwide-accent = { path = "crates/accent" }
screenwide-annotations = { path = "crates/annotations" }
screenwide-captions = { path = "crates/captions" }
screenwide-capture = { path = "crates/capture" }
screenwide-compositor = { path = "crates/compositor" }
screenwide-cursor-effects = { path = "crates/cursor_effects" }
screenwide-export = { path = "crates/export" }
screenwide-gpu = { path = "crates/gpu" }
screenwide-i18n = { path = "crates/i18n" }
screenwide-images = { path = "crates/images" }
screenwide-imaging = { path = "crates/imaging" }
screenwide-keyboard-effects = { path = "crates/keyboard_effects" }
screenwide-lexicon = { path = "crates/lexicon" }
screenwide-moments = { path = "crates/moments" }
screenwide-osc = { path = "crates/osc" }
screenwide-output = { path = "crates/output" }
screenwide-project = { path = "crates/project" }
screenwide-records = { path = "crates/records" }
screenwide-scenes = { path = "crates/scenes" }
screenwide-sidecar = { path = "crates/sidecar" }
screenwide-speech = { path = "crates/speech" }
screenwide-timeline = { path = "crates/timeline" }
screenwide-timeline-edit = { path = "crates/timeline_edit" }
# The transcriber's protocol only; the engine builds into its own program.
screenwide-transcriber = { path = "transcriber" }
screenwide-wgsl = { path = "crates/wgsl" }
block2 = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
cc = "1"
cidre = { version = "0.19.0", default-features = false, features = ["async", "ax", "cg", "core_audio", "iio", "io_surface", "macos_14_2", "ns", "sc", "vn", "vt"] }
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
cpal = "0.18.1"
dispatch2 = "0.3.1"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
getrandom = "0.3"
# Folding text for matching words: already built for URL handling, so
# nothing new is compiled for it.
icu_normalizer = "2.2"
# Every format except AVIF, which the image crate can only encode and nothing
# here encodes; it is the costliest dependency to compile.
image = { version = "0.25.10", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
naga = "30"
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "output-threaded"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
png = "0.18.1"
pollster = "1.0.1"
quantette = "0.6.0"
rayon = "1.12.0"
realfft = "3.5.0"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-global-shortcut = "2.3.2"
# Crates below the app use Tauri plainly; the app's own entry carries the
# features `tauri.conf.json` needs, which the Tauri CLI keeps in step.
tauri = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
trash = "5"
ts-rs = "=12.0.1"
unic-langid = "0.9"
wasapi = "0.23.0"
wgpu = "30.0.0"
windows = "0.62.2"
windows-numerics = "0.3.1"
xcap = "0.9.8"

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
# macOS: honor focused(false) when creating hidden overlay webviews.
wry = { path = "vendor/wry-0.55.1" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Desktop only: the staticlib and cdylib types Tauri's template adds serve its
# mobile targets and would make every build link two more copies of the app.
name = "screenwide_lib"
crate-type = ["rlib"]
# There are no doctests, and running them would make `cargo test` compile the
# whole library a second time alongside the test build.
doctest = false

[[bin]]
name = "screenwide"
path = "src/main.rs"
# `main.rs` holds no tests; testing it would also need that second build.
test = false

[build-dependencies]
cc.workspace = true
screenwide-wgsl.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico", "image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-window-state = "2.4.1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
xcap.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-clipboard-manager = "2.3.2"
# The clipboard-manager plugin's own clipboard crate, used directly for what
# the plugin does not expose: the files a copy in Finder or Explorer holds.
arboard = "3.6.1"
image.workspace = true
rqrr = { version = "0.10.1", default-features = false, features = ["img"] }
rxing = { version = "0.9.2", default-features = false, features = ["decoders", "encoding_rs", "multi_barcode_readers", "qrcode"] }
rapidfuzz = "0.5.0"
rayon.workspace = true
cpal.workspace = true
yuv = "0.8.16"
quantette.workspace = true
png.workspace = true
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-autostart = "2.5.1"
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
url = "2"
keyboard-types = "0.7"
# Transcription model downloads. The same reqwest and rustls the updater
# brings, with its TLS provider: nothing new is compiled for them.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
sys-locale.workspace = true
screenwide-accent.workspace = true
screenwide-annotations.workspace = true
screenwide-capture.workspace = true
screenwide-captions.workspace = true
screenwide-compositor.workspace = true
screenwide-cursor-effects.workspace = true
screenwide-export.workspace = true
screenwide-gpu.workspace = true
screenwide-i18n.workspace = true
screenwide-images.workspace = true
screenwide-imaging.workspace = true
screenwide-keyboard-effects.workspace = true
screenwide-lexicon.workspace = true
screenwide-moments.workspace = true
screenwide-osc.workspace = true
screenwide-output.workspace = true
screenwide-project.workspace = true
screenwide-records.workspace = true
screenwide-scenes.workspace = true
screenwide-sidecar.workspace = true
screenwide-speech.workspace = true
screenwide-transcriber.workspace = true
screenwide-timeline.workspace = true
screenwide-timeline-edit.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winvd = "0.0.49"
windows058 = { package = "windows", version = "0.58.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55.0"
tauri-plugin-single-instance = "2"
xcap = { workspace = true, features = ["wgc"] }
nokhwa = { workspace = true, features = ["input-msmf"] }
rdev = { git = "https://github.com/Narsil/rdev", rev = "c77b4e5456301cfa7f2226020f2a58f2f8d77c5d", features = ["serialize"] }
windows = { workspace = true, features = [
  "Foundation",
  "Graphics_Imaging",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Media_Ocr",
  "Storage_Streams",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D11on12",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_DirectShow",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# What `windows::core::implement` expands to names this crate, so the drop
# target's COM object needs it in scope: the version `windows` itself uses.
windows-core = "0.62.2"
wasapi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
core-foundation.workspace = true
core-graphics.workspace = true
nokhwa = { workspace = true, features = ["input-avfoundation"] }
tauri-plugin-macos-permissions = "2.3.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
cidre.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
plist = "1"

[dev-dependencies]
screenwide-annotations = { workspace = true, features = ["test-support"] }
screenwide-images = { workspace = true, features = ["test-support"] }
screenwide-osc = { workspace = true, features = ["test-support"] }
screenwide-output = { workspace = true, features = ["test-support"] }
screenwide-project = { workspace = true, features = ["test-support"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }

# Screenshot encoding is tight numeric work: colour quantization and deflate.
# Unoptimized, a Retina capture takes over eleven seconds to save in a dev
# build instead of about a second, so dependencies are optimized in dev builds.
# This crate stays unoptimized: optimizing it costs far more on every rebuild
# than the fraction of a second it saves a dev screenshot. Release builds are
# unaffected.
[profile.dev.package."*"]
opt-level = 3
