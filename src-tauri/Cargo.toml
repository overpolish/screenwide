[package]
name = "screenwide"
description = "Reliable screen and audio recording for macOS and Windows"
version.workspace = true
authors.workspace = true
# The paid tools and their licence gate are under the Elastic License 2.0.
license = "GPL-3.0-or-later AND Elastic-2.0"
edition.workspace = true

[lints]
workspace = true

# The app crate sits on top; the crates under `crates/` are what it is built
# from, each a layer the ones above it depend on and never the reverse.
[workspace]
members = ["crates/*"]
# The transcriber builds into its own program and the window hider into its
# own library, each with its own profile, and the vendored crates are only
# patches.
exclude = ["transcriber", "vendor", "window-hider"]

[workspace.package]
version = "1.0.3"
authors = ["overpolish"]
license = "GPL-3.0-or-later"
edition = "2021"

# CI's hosted runners have no hardware GPU or video encoder, and build with
# `--cfg screenwide_no_gpu` so the tests that need one are ignored there.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(screenwide_no_gpu)"] }

[workspace.dependencies]
screenwide-accent = { path = "crates/accent" }
screenwide-activity = { path = "crates/activity" }
screenwide-annotations = { path = "crates/annotations" }
screenwide-auto-zoom = { path = "crates/auto_zoom" }
screenwide-capture = { path = "crates/capture" }
screenwide-compositor = { path = "crates/compositor" }
screenwide-credits = { path = "crates/credits" }
screenwide-cursor-effects = { path = "crates/cursor_effects" }
screenwide-export = { path = "crates/export" }
screenwide-gpu = { path = "crates/gpu" }
screenwide-h264 = { path = "crates/h264" }
screenwide-i18n = { path = "crates/i18n" }
screenwide-images = { path = "crates/images" }
screenwide-imaging = { path = "crates/imaging" }
screenwide-keep-awake = { path = "crates/keep_awake" }
screenwide-keyboard-effects = { path = "crates/keyboard_effects" }
screenwide-lexicon = { path = "crates/lexicon" }
screenwide-licensing = { path = "crates/licensing" }
screenwide-moments = { path = "crates/moments" }
screenwide-openverse = { path = "crates/openverse" }
screenwide-osc = { path = "crates/osc" }
screenwide-output = { path = "crates/output" }
screenwide-placement = { path = "crates/placement" }
screenwide-project = { path = "crates/project" }
screenwide-qr = { path = "crates/qr" }
screenwide-records = { path = "crates/records" }
screenwide-scenes = { path = "crates/scenes" }
screenwide-settings-preview = { path = "crates/settings_preview" }
screenwide-shader-layout = { path = "crates/shader_layout" }
screenwide-sidecar = { path = "crates/sidecar" }
screenwide-sound-track = { path = "crates/sound_track" }
screenwide-speech = { path = "crates/speech" }
screenwide-system-keys = { path = "crates/system_keys" }
screenwide-text = { path = "crates/text" }
screenwide-timeline = { path = "crates/timeline" }
screenwide-timeline-edit = { path = "crates/timeline_edit" }
# The transcriber's protocol only; the engine builds into its own program.
screenwide-transcriber = { path = "transcriber" }
screenwide-wgsl = { path = "crates/wgsl" }
screenwide-window-hiding = { path = "crates/window_hiding" }
screenwide-workspace = { path = "crates/workspace" }
block2 = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
cc = "1"
cidre = { version = "0.19.0", default-features = false, features = ["async", "ax", "cg", "core_audio", "iio", "io_surface", "macos_14_2", "ns", "sc", "vn", "vt"] }
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
cpal = "0.18.1"
dispatch2 = "0.3.1"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
getrandom = "0.3"
# Folding text for matching words: already built for URL handling, so
# nothing new is compiled for it.
icu_normalizer = "2.2"
# Every format except AVIF, which the image crate can only encode and nothing
# here encodes; it is the costliest dependency to compile.
image = { version = "0.25.10", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
# Lossy WebP with transparency for exported screenshots, which the image
# crate cannot write (it encodes WebP losslessly only). Builds libwebp from
# its bundled source; libwebp is BSD-3-Clause.
libwebp-sys = "0.14.4"
naga = "30"
naga-types = "30"
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "output-threaded"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
png = "0.18.1"
pollster = "1.0.1"
quantette = "0.6.0"
rayon = "1.12.0"
realfft = "3.5.0"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
# Floats parsed exactly, so a project's numbers come back from Rust as the
# page sent them: the default parse can land one bit off, and an edit handed
# back changed by a bit reads as an edit of its own (an undo step).
serde_json = { version = "1", features = ["float_roundtrip"] }
sys-locale = "0.3"
tauri-plugin-global-shortcut = "2.3.2"
# Crates below the app use Tauri plainly; the app's own entry carries the
# features `tauri.conf.json` needs, which the Tauri CLI keeps in step.
tauri = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
trash = "5"
# Serde attributes that only shape reading, such as an alias kept for a value
# no longer written, have nothing to say to the TypeScript a type exports.
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
unic-langid = "0.9"
wasapi = "0.23.0"
wgpu = "30.0.0"
windows = "0.62.2"
windows-numerics = "0.3.1"
xcap = "0.9.8"
yuv = "0.8.16"
# Caption template packages, shared as zips: read and written with deflate,
# which is what every archiver writes.
zip = { version = "4", default-features = false, features = ["deflate"] }

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
nokhwa-bindings-windows = { path = "vendor/nokhwa-bindings-windows-0.4.6" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Desktop only: the staticlib and cdylib types Tauri's template adds serve its
# mobile targets and would make every build link two more copies of the app.
name = "screenwide_lib"
crate-type = ["rlib"]
# There are no doctests, and running them would make `cargo test` compile the
# whole library a second time alongside the test build.
doctest = false

[[bin]]
name = "screenwide"
path = "src/main.rs"
# `main.rs` holds no tests; testing it would also need that second build.
test = false

[build-dependencies]
cc.workspace = true
screenwide-shader-layout.workspace = true
screenwide-wgsl.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12 brings tray-icon 0.25, which attaches the tray menu only while it is
# open: on macOS 27 a menu left attached opens on a left click and swallows
# the icon's own click, which toggles the recording controls.
tauri = { version = "2.12", features = ["image-ico", "image-png", "macos-private-api", "protocol-asset", "tray-icon"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
xcap.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-clipboard-manager = "2.3.2"
# The clipboard-manager plugin's own clipboard crate, used directly for what
# the plugin does not expose: the files a copy in Finder or Explorer holds.
arboard = "3.6.1"
image.workspace = true
rapidfuzz = "0.5.0"
rayon.workspace = true
cpal.workspace = true
quantette.workspace = true
png.workspace = true
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-autostart = "2.5.1"
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
url = "2"
keyboard-types = "0.7"
# Transcription model downloads. The same reqwest and rustls the updater
# brings, with its TLS provider: nothing new is compiled for them.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
sys-locale.workspace = true
screenwide-accent.workspace = true
screenwide-activity.workspace = true
screenwide-annotations.workspace = true
screenwide-auto-zoom.workspace = true
screenwide-capture.workspace = true
screenwide-compositor.workspace = true
screenwide-credits.workspace = true
screenwide-cursor-effects.workspace = true
screenwide-export.workspace = true
screenwide-gpu.workspace = true
screenwide-i18n.workspace = true
screenwide-images.workspace = true
screenwide-imaging.workspace = true
screenwide-keep-awake.workspace = true
screenwide-keyboard-effects.workspace = true
screenwide-lexicon.workspace = true
screenwide-licensing.workspace = true
screenwide-moments.workspace = true
screenwide-openverse.workspace = true
screenwide-osc.workspace = true
screenwide-workspace.workspace = true
screenwide-output.workspace = true
screenwide-project.workspace = true
screenwide-qr.workspace = true
screenwide-records.workspace = true
screenwide-scenes.workspace = true
screenwide-settings-preview.workspace = true
screenwide-shader-layout.workspace = true
screenwide-sidecar.workspace = true
screenwide-sound-track.workspace = true
screenwide-speech.workspace = true
screenwide-system-keys.workspace = true
screenwide-text.workspace = true
screenwide-transcriber.workspace = true
screenwide-timeline.workspace = true
screenwide-timeline-edit.workspace = true
screenwide-window-hiding.workspace = true

