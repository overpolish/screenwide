[dev-dependencies]
screenwide-annotations = { workspace = true, features = ["test-support"] }
screenwide-images = { workspace = true, features = ["test-support"] }
screenwide-osc = { workspace = true, features = ["test-support"] }
screenwide-output = { workspace = true, features = ["test-support"] }
screenwide-project = { workspace = true, features = ["test-support"] }

# Screenshot encoding is tight numeric work: colour quantization and deflate.
# Unoptimized, a Retina capture takes over eleven seconds to save in a dev
# build instead of about a second, so dependencies are optimized in dev builds.
# This crate stays unoptimized: optimizing it costs far more on every rebuild
# than the fraction of a second it saves a dev screenshot. Release builds are
# unaffected.
[profile.dev.package."*"]
opt-level = 3

# A text box's outline and a caption word's are a distance field worked out
# on the CPU for every pixel of its atlas cell. Unoptimized, one cell takes a
# few hundred milliseconds in a dev build instead of about fifteen, so every
# change to a box's words stalls the preview. These two crates are optimized
# in dev builds for that; release builds are unaffected.
[profile.dev.package.screenwide-compositor]
opt-level = 3

[profile.dev.package.screenwide-text]
opt-level = 3

# A pinned annotation is followed through every frame at full size: the
# export crate reduces each decoded frame to its brightness and the
# annotations crate matches the pinned region in it. Unoptimized, a pin over
# a 2.7 second clip of a 1080p recording takes about 21 seconds in a dev build
# instead of one, and the export preview waits for it. These two crates are
# optimized in dev builds for that; release builds are unaffected.
[profile.dev.package.screenwide-annotations]
opt-level = 3

[profile.dev.package.screenwide-export]
opt-level = 3

# Camera frames are converted on the CPU at full size for every frame the
# camera delivers. Unoptimized, converting one 1080p NV12 frame takes about
# 70 milliseconds in a dev build instead of about six, so a 30 fps camera
# records and previews at 12. Optimized in dev builds for that; release builds
# are unaffected.
[profile.dev.package.screenwide-capture]
opt-level = 3

# Reading the QR codes on a busy page searches all of it, twice over. The two
# readers are generic over the picture, so their code is compiled in the crate
# that reads with them, and unoptimized a Retina page took over two seconds
# in a dev build instead of about a tenth of one. Optimized, without the dev
# build's checks, in dev builds for that, as is rxing's own part of the
# search; release builds are unaffected.
[profile.dev.package.screenwide-qr]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.rxing]
debug-assertions = false
overflow-checks = false
