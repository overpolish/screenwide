# SPDX-License-Identifier: GPL-3.0-or-later

# Screenwide's speech-to-text helper: a program of its own rather than part of
# the app, so a GPU runtime the computer lacks keeps only this from starting,
# a crash in the engine takes no recording with it, and its memory is all
# given back when it exits.
#
# The library half is the protocol alone and builds without the engine, so
# the app can share the types without compiling whisper.cpp.

[package]
name = "screenwide-transcriber"
version = "0.1.0"
description = "Speech-to-text helper for Screenwide"
authors = ["overpolish"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "screenwide_transcriber"
path = "src/lib.rs"

[[bin]]
name = "screenwide-transcriber"
path = "src/main.rs"
required-features = ["engine"]

# Dictation's helper, a program of its own: transcribe.cpp and whisper.cpp
# each build their own copy of ggml, and linked into one program the two
# copies' symbols collide. Built with only `dictation` on, it has transcribe.cpp's.
[[bin]]
name = "screenwide-dictation"
path = "src/dictation/main.rs"
required-features = ["dictation"]

# Dictation's cleanup helper, a program of its own for the same reason:
# llama.cpp builds its own ggml too.
[[bin]]
name = "screenwide-cleanup"
path = "src/cleanup/main.rs"
required-features = ["cleanup"]

[features]
engine = [
  "dep:whisper-rs",
  "dep:deep_filter",
  "dep:ndarray",
  "dep:ort",
  "dep:realfft",
  "dep:tract-core",
  "dep:tract-hir",
  "dep:tract-onnx",
  "dep:tract-pulse",
  "dep:windows",
]
# The notes' voice fingerprints run CAM++ in tract, on Kaldi features.
dictation = ["dep:transcribe-cpp", "dep:realfft", "dep:tract-onnx"]
cleanup = ["dep:llama-cpp-2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# llama.cpp for dictation's cleanup, which runs a small language model on
# what was heard. Each platform adds its GPU backend below.
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false }
whisper-rs = { version = "0.16.0", optional = true }
# transcribe.cpp for dictation, which streams with Parakeet: whisper.cpp
# cannot stream. Each platform adds its GPU backend below.
transcribe-cpp = { version = "=0.4.2", optional = true, default-features = false }
# DeepFilterNet 3 for Reduce noise, with its model built in. Only on GitHub:
# the crates.io release predates the inference this needs.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# Held at the tract release libDF was last built with: later ones moved to
# ndarray 0.16 and changed the graph API it reads.
tract-core = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
# ONNX Runtime for Studio sound, whose speech restoration model is too large
# for tract to run at a usable speed. Linked in statically from pyke's builds;
# each platform adds its GPU backend below.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "api-24"] }
# The restoration model's input features and the separation model's spectrum
# are computed here rather than by a Python library: the same FFT the app
# uses.
realfft = { version = "3.5.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal"] }
transcribe-cpp = { version = "=0.4.2", optional = true, default-features = false, features = ["metal"] }
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["metal"] }
# Studio sound on the GPU through WebGPU, which Dawn runs over Metal. Dawn
# stays a library of its own beside the helper; copy-dylibs puts it beside
# each build and test, and build.rs tells the helper where to find it. Object
# following runs through CoreML, which answers it correctly and fast where
# WebGPU does not.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["webgpu", "coreml", "copy-dylibs"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["vulkan"] }
transcribe-cpp = { version = "=0.4.2", optional = true, default-features = false, features = ["vulkan"] }
llama-cpp-2 = { version = "=0.1.161", optional = true, default-features = false, features = ["vulkan"] }
# Studio sound on the GPU through DirectML, on x64 and ARM64 alike. pyke's
# WebGPU build brings a DXC of its own that would clash with the app's.
# DirectML.dll ships beside the helper, which Windows looks in first.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["directml", "copy-dylibs"] }
# Other programs' use of the GPU, read before each step of a model, and the
# graphics driver a GPU reset is remembered against (`shared_gpu`).
windows = { version = "0.62.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_Threading",
] }

# tract 0.21.4 cannot build its ARM64 kernels for Windows; the vendored copy
# can (`../vendor/README.md`).
[patch.crates-io]
tract-linalg = { path = "../vendor/tract-linalg-0.21.4" }
# Screenwide's fork of transcribe.cpp (overpolish/transcribe.cpp, branch
# `hex/parakeet-vocabulary-tree`): Hex's Parakeet vocabulary rescoring merged
# onto upstream 0.4.2, rescoring a stream as it goes, for dictation's word
# list, and NVIDIA's Nemotron 3 Diarization loaded from NVIDIA's own GGUF,
# for the notes' speakers.
transcribe-cpp = { git = "https://github.com/overpolish/transcribe.cpp", rev = "ef7df188c9b80978b1df0c56c2d21612691f7434" }
transcribe-cpp-sys = { git = "https://github.com/overpolish/transcribe.cpp", rev = "ef7df188c9b80978b1df0c56c2d21612691f7434" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
