# Screenwide's speech-to-text helper: a program of its own rather than part of
# the app, so a GPU runtime the computer lacks keeps only this from starting,
# a crash in the engine takes no recording with it, and its memory is all
# given back when it exits.
#
# The library half is the protocol alone and builds without the engine, so
# the app can share the types without compiling whisper.cpp.

[package]
name = "screenwide-transcriber"
version = "0.1.0"
description = "Speech-to-text helper for Screenwide"
authors = ["overpolish"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "screenwide_transcriber"
path = "src/lib.rs"

[[bin]]
name = "screenwide-transcriber"
path = "src/main.rs"
required-features = ["engine"]

[features]
engine = [
  "dep:whisper-rs",
  "dep:deep_filter",
  "dep:ndarray",
  "dep:ort",
  "dep:realfft",
  "dep:tract-core",
  "dep:tract-hir",
  "dep:tract-onnx",
  "dep:tract-pulse",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16.0", optional = true }
# DeepFilterNet 3 for Reduce noise, with its model built in. Only on GitHub:
# the crates.io release predates the inference this needs.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# Held at the tract release libDF was last built with: later ones moved to
# ndarray 0.16 and changed the graph API it reads.
tract-core = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
# ONNX Runtime for Studio sound, whose speech restoration model is too large
# for tract to run at a usable speed. Linked in statically from pyke's builds;
# each platform adds its GPU backend below.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "api-24"] }
# The restoration model's input features are computed here rather than by a
# Python library: the same FFT the app uses.
realfft = { version = "3.5.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal"] }
# Studio sound on the GPU through WebGPU, which Dawn runs over Metal. Dawn
# stays a library of its own beside the helper; copy-dylibs puts it beside
# each build and test, and build.rs tells the helper where to find it.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["webgpu", "copy-dylibs"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["vulkan"] }
# Studio sound on the GPU through DirectML, on x64 and ARM64 alike. pyke's
# WebGPU build brings a DXC of its own that would clash with the app's.
# DirectML.dll ships beside the helper, which Windows looks in first.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["directml", "copy-dylibs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
